name: Quality

on:
  push:
    branches: [main, feature/enterprise-portfolio]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v0.7.0
        with:
          root: .
          css: true
      - name: Check required assets
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f assets/favicon.svg
